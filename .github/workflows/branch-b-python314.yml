name: Branch B Python 3.14 checks

on:
  push:
    paths:
      - "branch_b/**"
      - "validator/**"
      - "interface_package/**"
      - "golden_cases/**"
      - ".github/workflows/branch-b-python314.yml"
  pull_request:
    paths:
      - "branch_b/**"
      - "validator/**"
      - "interface_package/**"
      - "golden_cases/**"
      - ".github/workflows/branch-b-python314.yml"
  workflow_dispatch:

jobs:
  validator-and-branch-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Record and verify Python 3.14 interpreter
        run: |
          python --version
          python -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 jsonschema==4.26.0 numpy==2.5.3 -r branch_b/requirements-output-dev.txt
      - name: Record dependency versions
        run: python -m pip freeze | tee branch-b-pip-freeze.txt
      - name: Run Week 9 mathematical reference checks
        run: |
          python -m pytest -q branch_b/recovery_tests/test_exact_tie_dp.py branch_b/recovery_tests/test_week9_objective_reference.py --junitxml=week9-reference-junit.xml
      - name: Record Week 9 source and runtime identity
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, sys
          assert sys.version_info[:2] == (3, 14), sys.version
          paths = [
              'branch_b/fitters/exact_tie_dp.py',
              'branch_b/recovery_tests/test_exact_tie_dp.py',
              'branch_b/recovery_tests/test_week9_objective_reference.py',
          ]
          record = {
              'python': sys.version,
              'platform': platform.platform(),
              'tested_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'workflow_sha': os.environ.get('GITHUB_SHA'),
              'source_sha256': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
              'scope': 'synthetic mathematical reference; not scientific fitter certification',
          }
          pathlib.Path('week9-reference-environment.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Run shared validator tests
        run: python -m pytest validator -q --junitxml=validator-junit.xml
      - name: Run complete repository test suite on Python 3.14
        run: python -m pytest -q --basetemp=.pytest_tmp --junitxml=branch-b-junit.xml
      - name: Preserve test and environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-b-python314-test-evidence
          path: |
            branch-b-pip-freeze.txt
            validator-junit.xml
            branch-b-junit.xml
            week9-reference-junit.xml
            week9-reference-environment.json
          if-no-files-found: warn
