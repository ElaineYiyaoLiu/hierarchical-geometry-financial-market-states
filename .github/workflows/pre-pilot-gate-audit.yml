name: pre-pilot-gate-audit

on:
  push:
    paths:
      - "governance/**"
      - "configuration_completeness.json"
      - "pilot_precision_plan.yaml"
      - ".github/workflows/pre-pilot-gate-audit.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-register-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify guard behavior
        run: python -m pytest -q governance/test_pre_pilot_audit.py governance/test_a_pl_preparation.py governance/test_freeze_reconciliation.py governance/test_queue_freeze_bindings.py governance/test_revision_preparation.py governance/test_later_stage_audit.py governance/test_threshold_blind_preparation.py governance/week4/test_sealed_transport.py governance/week4/test_escalation_signatures.py governance/week4/test_audit_guards.py --junitxml=pre_pilot_audit_tests.xml
      - name: Dummy signed transport rehearsal
        run: python governance/week4/run_sealed_rehearsal.py --output sealed_transport_rehearsal
      - name: Audit current public evidence without granting approval
        run: python governance/audit_pre_pilot.py --output pre_pilot_gate_audit.json
      - name: Prepare A and PL closure queue
        run: python governance/prepare_a_pl_queue.py --output a_pl_closure_queue.json
      - name: Check available minimum-effect provenance without inferring historical approval
        run: python governance/check_minimum_effect_provenance.py --record governance/minimum_effect_provenance.template.json --output minimum_effect_consistency.json
      - name: Reconcile public freeze references without granting approval
        run: python governance/check_freeze_reconciliation.py --output freeze_reconciliation.json
      - name: Audit future bounded revision preparation without approving it
        run: python governance/audit_revision_preparation.py --output revision_preparation.json
      - name: Inspect later-stage blank preparation without authorization
        run: |
          for mode in receipt capacity allocation burn; do
            python governance/later_stage_audit.py --mode "$mode" --record governance/week6_8/operational_record.template.json --output "later_${mode}.json"
          done
          for mode in trace blind; do
            python governance/threshold_blind_preparation.py --mode "$mode" --record governance/week6_8/operational_record.template.json --output "later_${mode}.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: public-pre-pilot-gate-audit-${{ github.sha }}
          path: |
            pre_pilot_gate_audit.json
            pre_pilot_audit_tests.xml
            a_pl_closure_queue.json
            minimum_effect_consistency.json
            freeze_reconciliation.json
            revision_preparation.json
            later_*.json
            sealed_transport_rehearsal/
