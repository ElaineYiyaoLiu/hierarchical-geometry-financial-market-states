name: Branch B Python 3.14 checks

on:
  push:
    paths:
      - "branch_b/**"
      - "validator/**"
      - "interface_package/**"
      - "golden_cases/**"
      - ".github/workflows/branch-b-python314.yml"
  pull_request:
    paths:
      - "branch_b/**"
      - "validator/**"
      - "interface_package/**"
      - "golden_cases/**"
      - ".github/workflows/branch-b-python314.yml"
  workflow_dispatch:

jobs:
  validator-and-branch-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Record interpreter
        run: python --version
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 jsonschema==4.26.0 numpy==2.5.3
      - name: Run shared validator tests
        run: python -m pytest validator -q
      - name: Run Branch B Week 2 tests
        run: python -m pytest branch_b/support_tests branch_b/recovery_tests branch_b/failure_tests -q
