version: 1
owner: branch_b
status: development
policy:
  branch_a_or_generator_owned_seeds: prohibited
  hidden_or_evaluation_only_seeds: prohibited
  record_all_stochastic_steps: true
  freeze_before_locked_testing: true
  primary_common_fitter_random_restarts: 0
  primary_common_fitter_deterministic: true
  record_run_seed_field_even_if_not_consumed: true
namespaces:
  implementation_tests:
    purpose: deterministic Branch B development and unit tests
  geometry_selection:
    purpose: Branch B-owned stochastic geometry-selection steps, if any
  fitter_initialization:
    purpose: provenance field for the Common Fitter; registered primary initialization is deterministic and consumes no random restart
  bootstrap:
    purpose: Branch B bootstrap resampling
  robustness:
    purpose: prespecified Branch B robustness analyses
base_seed_values:
  status: unset
  note: Numerical Branch B-owned production seed values remain to be assigned through the project seed record before any stochastic production step; no generator-owned seed may be used.
