name: validate

on:
  push:
  pull_request:

jobs:
  interface-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python --version
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install numpy==2.5.3
      - run: python -m pytest -q
